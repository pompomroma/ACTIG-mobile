name: Deploy PWA (GitHub Pages)

# Publishes the installable web app in web/ to GitHub Pages, so you can install
# ACTIG straight from Safari on your iPhone (Add to Home Screen) — no PC, no
# Apple account, no signing. URL after first deploy:
#   https://pompomroma.github.io/ACTIG-mobile/

# Runs only when triggered manually (Actions tab -> Deploy PWA -> Run workflow),
# AFTER the owner has enabled Pages once (Settings -> Pages -> Source: GitHub
# Actions). This avoids a red failure on every push while Pages is off. Until
# then, install instantly via the CDN URL in docs/INSTALL_NO_MAC.md (no setup).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # NOTE: GitHub does not allow the Actions token to *create* the Pages site
      # (it returns "Resource not accessible by integration"). The repo owner
      # must turn Pages on ONCE: repo Settings -> Pages -> Build and deployment ->
      # Source: "GitHub Actions" (doable from Safari). After that this deploys
      # automatically on every push.
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload web/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
