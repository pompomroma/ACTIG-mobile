name: Deploy PWA (GitHub Pages)

# Publishes the installable web app in web/ to GitHub Pages, so you can install
# ACTIG straight from Safari on your iPhone (Add to Home Screen) — no PC, no
# Apple account, no signing. URL after first deploy:
#   https://pompomroma.github.io/ACTIG-mobile/

on:
  push:
    branches: ["claude/iphone-local-agentic-ai-nj6xr4", "main"]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-create the Pages site on first run (uses the pages:write token),
          # so no manual Settings toggle is needed.
          enablement: true
      - name: Upload web/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
