name: iOS Build

# Builds ACTIG entirely in the cloud — NO Mac and NO Xcode required on your side.
# - Every push/PR: compile gate + unit tests (Simulator).
# - Every push: build an UNSIGNED .ipa and upload it as an artifact you can
#   download and install via AltStore / Sideloadly from a Windows or Mac PC
#   (works with a free Apple ID). See docs/INSTALL_NO_MAC.md.
# - Version tag (v*): sign with an App Store Connect API key and upload to
#   TestFlight, so you can install over-the-air from the TestFlight app
#   (requires a paid Apple Developer account + repo secrets).

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  build-test:
    name: Build & Test (Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Show toolchain & pick a simulator
        id: sim
        run: |
          set -euo pipefail
          xcodebuild -version
          DEVICE=$(xcrun simctl list devices available | grep -Eo 'iPhone [0-9][^(]*' | head -1 | sed 's/ *$//')
          echo "Using simulator: '$DEVICE'"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
      - name: Build (compile gate)
        run: |
          set -euo pipefail
          xcodebuild -project ACTIG.xcodeproj -scheme ACTIG \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation clean build
      - name: Test
        run: |
          set -euo pipefail
          xcodebuild -project ACTIG.xcodeproj -scheme ACTIG \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -skipPackagePluginValidation test

  # No-Mac install path #1: a downloadable UNSIGNED .ipa for AltStore/SideStore/
  # Sideloadly. Needs only a normal Apple ID — NO App Store Connect / paid account.
  package-ipa:
    name: Package unsigned .ipa (artifact)
    needs: build-test
    runs-on: macos-15
    permissions:
      contents: write   # to publish the .ipa to a GitHub Release
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Archive without signing
        run: |
          set -euo pipefail
          xcodebuild -project ACTIG.xcodeproj -scheme ACTIG \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ACTIG.xcarchive \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive
      - name: Package into Payload/ACTIG.ipa
        run: |
          set -euo pipefail
          APP="build/ACTIG.xcarchive/Products/Applications/ACTIG.app"
          rm -rf build/Payload && mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry ACTIG-unsigned.ipa Payload)
          ls -lh build/ACTIG-unsigned.ipa
      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ACTIG-unsigned-ipa
          path: build/ACTIG-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      # Publish to a rolling "build-latest" pre-release so the .ipa has a stable,
      # phone-downloadable URL (Safari, AltStore/SideStore "install from URL").
      # No App Store Connect involved — uses the repo's GITHUB_TOKEN.
      - name: Publish .ipa to a rolling GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest
          name: ACTIG latest build (unsigned .ipa)
          prerelease: true
          files: build/ACTIG-unsigned.ipa
          body: |
            Unsigned `.ipa` for sideloading with AltStore / SideStore / Sideloadly.
            **No App Store Connect or paid account needed** — a free Apple ID works.
            See `docs/INSTALL_NO_MAC.md`. Rebuilt automatically on each push.

  # No-Mac install path #2: over-the-air via TestFlight (paid account + secrets).
  testflight:
    name: Archive & TestFlight
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install App Store Connect API key
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Archive (cloud signing)
        run: |
          set -euo pipefail
          xcodebuild -project ACTIG.xcodeproj -scheme ACTIG \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ACTIG.xcarchive \
            -skipPackagePluginValidation \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            archive

      - name: Export IPA
        run: |
          set -euo pipefail
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/ACTIG.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to TestFlight
        run: |
          set -euo pipefail
          IPA=$(ls build/export/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
